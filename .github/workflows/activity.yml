name: Natural GitHub Activity Bot

on:
  schedule:
    - cron: '0 6 * * *'      # 11:30 AM IST
    - cron: '0 12 * * *'     # 5:30 PM IST
    - cron: '45 15 * * *'    # 9:15 PM IST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config --global user.name "Arnavj217"
          git config --global user.email "arnavjain2107@gmail.com"

      - name: Install Python
        run: |
          python3 -m pip install --upgrade pip
          pip3 install pytz

      # Always start from the latest main branch
      - name: Sync with remote
        run: |
          git fetch origin
          git checkout main
          git reset --hard origin/main

      - name: Run commit script
        run: |
          python3 commit.py

      - name: Commit changes
        run: |
          git add .

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "$(python3 - <<'EOF'
          import random
          msgs = [
              '✨ One step at a time',
              '🚀 Daily activity update',
              '🌱 Keep growing',
              '💡 Small progress matters',
              '🔥 Staying consistent',
              '🛠️ Code maintenance',
              '📈 Daily improvements',
              '🎯 Automated contribution',
              '⚡ Repository update',
              '🌟 Another productive step'
          ]
          print(random.choice(msgs))
          EOF
          )"

      - name: Push changes
        run: |
          for i in 1 2 3
          do
            git pull --rebase origin main

            if git push origin HEAD:main; then
              echo "Push successful."
              exit 0
            fi

            echo "Push failed. Retrying..."
            sleep 5
          done

          echo "Push failed after 3 attempts."
          exit 1
